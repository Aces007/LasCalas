name: Deploy LasCalas to DreamHost

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync files via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: dh_ukvmuf
          server: ${{ secrets.DREAMHOST_HOST }}
          password: ${{ secrets.DREAMHOST_PASSWORD }}
          port: 22
          local_path: ./*
          remote_path: /path/to/your/lascalas/folder
          sftp_only: true
          delete_remote_files_with_local: true  # keeps remote in sync