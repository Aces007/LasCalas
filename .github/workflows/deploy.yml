name: Deploy LasCalas to DreamHost

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Bumping to 20 fixes the Vite requirement error

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build

      - name: Deploy dist to DreamHost
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.FTP_USERNAME }}
          server: ${{ secrets.FTP_SERVER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          local_path: './dist/*'
          # Using the absolute path we saw in your File Manager screenshot
          remote_path: '/home/dh_ukvmuf/lascalasresort.com/'
          sftp_only: true
          delete_remote_files: false # Set to true if you want it to wipe old files automatically